name: Build and Release

on:
  workflow_dispatch:

  push:
    tags:
      - "v*.*.*"

  pull_request_target:
    types: [labeled]

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    environment: build
    if: "!contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - uses: actions/checkout@v2
        with:
          submodules: true
          fetch-depth: 0

      - name: Cache Android SDK
        id: cache-asdk
        uses: actions/cache@v4
        with:
          path: $HOME/.android/sdk
          key: cache-asdk

      - name: Setup Java SDK
        if: steps.cache-jdk.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          java-version: 17
          cache: 'gradle'

      - name: Setup Android SDK
        if: steps.cache-asdk.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;36.0.0"

      - name: Build apk
        run: bash ./gradlew clean assembleFdroidRelease

      - name: Sign apk
        run: |
          export PATH="$PATH:${ANDROID_SDK_ROOT}/build-tools/36.0.0/"
          zipalign -v -p 4 ./presentation/build/outputs/apk/fdroid/release/presentation-fdroid-release-unsigned.apk presentation-fdroid-release-unsigned-aligned.apk
          mkdir -p release
          apksigner sign --ks "./adoyle-apk-key.jks" --ks-key-alias "adoyle" --ks-pass "pass:${{secrets.KS_PASS}}" --key-pass "pass:${{secrets.KS_PASS}}" --out release/Cryptomator-fdroid-${{ github.ref_name }}_signed.apk presentation-fdroid-release-unsigned-aligned.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ github.ref_name }}
          #path: presentation/build/outputs/apk/fdroid/release/*.apk
          path: release/*.apk

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: "github.ref_type == 'tag' && !contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: artifact-${{ github.ref_name }}
          path: dist/

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
